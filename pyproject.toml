[project]
name = "info8006"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.2",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scipy>=1.18.1",
    "tqdm>=4.70.1",
]

# PyTorch is only needed by the lecture 7 notebooks and by project 2. It is kept
# apart so that `uv sync` works on every machine: since torch 2.3, there are no
# wheels for Intel Macs, which would otherwise fail to install the environment.
[project.optional-dependencies]
torch = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
